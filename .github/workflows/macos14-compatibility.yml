name: macOS 14 Compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "DevSearch/**"
      - "DevSearchTests/**"
      - "packaging/**"
      - "scripts/package-local.sh"
      - "project.yml"
      - ".github/fixtures/**"
      - ".github/workflows/macos14-compatibility.yml"

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build and launch on macOS 14
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile app and tests with Xcode 16.2
        run: |
          xcodegen generate
          xcodebuild build-for-testing \
            -project DevSearch.xcodeproj \
            -scheme DevSearch \
            -destination "platform=macOS" \
            -derivedDataPath .build/CompatibilityTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build universal compatibility package
        env:
          PACKAGE_ROOT: ${{ github.workspace }}/.build/macos14-package
        run: zsh scripts/package-local.sh

      - name: Verify native packaged app can launch
        run: |
          app=".build/macos14-package/DerivedData/Build/Products/Release/DevSearch.app"
          binary="${app}/Contents/MacOS/DevSearch"
          support="${HOME}/Library/Application Support/DevSearch"
          crash_marker=".build/macos14-package/crash-marker"

          test "$(uname -r | cut -d. -f1)" = "23"
          test "$(lipo -archs "${binary}")" = "x86_64 arm64" ||
            test "$(lipo -archs "${binary}")" = "arm64 x86_64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "${app}/Contents/Info.plist")" = "14.0"
          codesign --verify --deep --strict --verbose=2 "${app}"

          mkdir -p "${support}"
          cp .github/fixtures/duplicate-legacy-data.json "${support}/data.json"
          touch "${crash_marker}"

          open "${app}"
          pid=""
          for attempt in {1..20}; do
            if pid="$(pgrep -f "${binary}" | head -n 1)"; then
              break
            fi
            sleep 0.5
          done

          if [[ -z "${pid}" ]]; then
            find "${HOME}/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'DevSearch*' -newer "${crash_marker}" -print -exec cat {} \; || true
            exit 1
          fi

          sleep 30
          if ! kill -0 "${pid}" 2>/dev/null; then
            find "${HOME}/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'DevSearch*' -newer "${crash_marker}" -print -exec cat {} \; || true
            exit 1
          fi

          if find "${HOME}/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'DevSearch*' -newer "${crash_marker}" -print -quit | grep -q .; then
            find "${HOME}/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'DevSearch*' -newer "${crash_marker}" -print -exec cat {} \;
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              (Path.home() / "Library/Application Support/DevSearch/data.json").read_text()
          )
          for collection in ("scanRoots", "projects", "editors"):
              identifiers = [
                  item["canonicalPath"] if collection != "editors" else item["id"]
                  for item in data.get(collection, [])
              ]
              assert len(identifiers) == len(set(identifiers)), collection
          PY

          kill "${pid}"
          wait "${pid}" || true

      - name: Verify x86_64 packaged app under Rosetta
        run: |
          app=".build/macos14-package/DerivedData/Build/Products/Release/DevSearch.app"
          binary="${app}/Contents/MacOS/DevSearch"
          support="${HOME}/Library/Application Support/DevSearch"
          crash_marker=".build/macos14-package/x86-crash-marker"
          launch_log=".build/macos14-package/x86-launch.log"

          /usr/bin/arch -x86_64 /usr/bin/true
          cp .github/fixtures/duplicate-legacy-data.json "${support}/data.json"
          touch "${crash_marker}"

          /usr/bin/arch -x86_64 "${binary}" >"${launch_log}" 2>&1 &
          pid=$!

          sleep 30
          if ! kill -0 "${pid}" 2>/dev/null; then
            cat "${launch_log}" || true
            find "${HOME}/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'DevSearch*' -newer "${crash_marker}" -print -exec cat {} \; || true
            exit 1
          fi

          if find "${HOME}/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'DevSearch*' -newer "${crash_marker}" -print -quit | grep -q .; then
            cat "${launch_log}" || true
            find "${HOME}/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'DevSearch*' -newer "${crash_marker}" -print -exec cat {} \;
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              (Path.home() / "Library/Application Support/DevSearch/data.json").read_text()
          )
          for collection in ("scanRoots", "projects", "editors"):
              identifiers = [
                  item["canonicalPath"] if collection != "editors" else item["id"]
                  for item in data.get(collection, [])
              ]
              assert len(identifiers) == len(set(identifiers)), collection
          PY

          kill "${pid}"
          wait "${pid}" || true

      - name: Upload compatibility package
        uses: actions/upload-artifact@v4
        with:
          name: RepoGlance-macOS14
          path: |
            .build/macos14-package/RepoGlance-*.dmg
            .build/macos14-package/RepoGlance-*.dmg.sha256
            .build/macos14-package/RepoGlance-*.zip
            .build/macos14-package/RepoGlance-*.zip.sha256
          if-no-files-found: error
